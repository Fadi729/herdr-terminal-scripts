id = "terminal-scripts"
name = "Terminal Scripts"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Run predefined Scripts from a popup or numbered Slots"
platforms = ["linux", "macos"]

[[actions]]
id = "picker"
title = "Open Script popup"
contexts = ["workspace"]
command = ["node", "--experimental-strip-types", "src/main.ts"]

[[actions]]
id = "run-1"
title = "Run Script slot 1"
contexts = ["workspace"]
command = ["node", "--experimental-strip-types", "src/main.ts"]

