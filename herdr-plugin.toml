id = "terminal-scripts"
name = "Terminal Scripts"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Run predefined Scripts from a popup or numbered Slots"
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "ci", "--include=dev"]

[[build]]
command = ["npm", "run", "build"]

[[actions]]
id = "picker"
title = "Open Script popup"
contexts = ["workspace"]
command = ["node", "dist/main.js"]

[[actions]]
id = "run-1"
title = "Run Script slot 1"
contexts = ["workspace"]
command = ["node", "dist/main.js"]

[[actions]]
id = "run-2"
title = "Run Script slot 2"
contexts = ["workspace"]
command = ["node", "dist/main.js"]

[[actions]]
id = "run-3"
title = "Run Script slot 3"
contexts = ["workspace"]
command = ["node", "dist/main.js"]

[[actions]]
id = "run-4"
title = "Run Script slot 4"
contexts = ["workspace"]
command = ["node", "dist/main.js"]

[[actions]]
id = "run-5"
title = "Run Script slot 5"
contexts = ["workspace"]
command = ["node", "dist/main.js"]

[[actions]]
id = "run-6"
title = "Run Script slot 6"
contexts = ["workspace"]
command = ["node", "dist/main.js"]

[[actions]]
id = "run-7"
title = "Run Script slot 7"
contexts = ["workspace"]
command = ["node", "dist/main.js"]

[[actions]]
id = "run-8"
title = "Run Script slot 8"
contexts = ["workspace"]
command = ["node", "dist/main.js"]

[[actions]]
id = "run-9"
title = "Run Script slot 9"
contexts = ["workspace"]
command = ["node", "dist/main.js"]

[[panes]]
id = "picker"
title = "Terminal Scripts"
placement = "popup"
width = "70%"
height = 18
command = ["node", "dist/main.js"]
